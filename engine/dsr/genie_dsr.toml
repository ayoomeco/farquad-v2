# Genie Jutsu OS: runtime configuration.
# Model names, engine plugins and prices live HERE, not in code, so models can be
# upgraded by editing this file (or adding a plugin module) without rebuilding the app.
# Never put secrets in this file. Secrets come from environment variables only.

[app]
name = "Genie Jutsu OS"
version = "GJ V2"

[llm]
provider = "ollama"
url = "http://127.0.0.1:11434"      # env OLLAMA_URL overrides
model = "qwen3.5:4b"                # director brain (final sweep Oct 7: tool-use 79.9 TAU2, multimodal). env OLLAMA_MODEL overrides
fallback_models = ["llama3.2:3b"]   # used automatically when the primary is not pulled in Ollama
temperature = 0.45
timeout_s = 180
num_ctx = 2048
keep_alive = "30m"                  # keep the model loaded between turns
chat_max_tokens = 250               # Director replies stay short
plan_max_tokens = 220
warmup = true                       # preload model + system prompt on server start (env JUTSU_WARMUP=0 disables)

[queue]
max_attempts = 3
retry_backoff_s = 2.0
poll_interval_s = 0.5
worker_enabled = true               # env JUTSU_WORKER=0 disables the background worker

[billing]
# Master kill-switch for any paid/cloud GPU work. Even with the owner's per-job approval,
# a billable engine refuses to go live unless this is true AND the engine is in "live" mode.
allow_billable_dispatch = false

[store]
# "sqlite" (default, local, authoritative queue). Supabase is an optional MIRROR of job state,
# enabled only when JUTSU_SUPABASE_URL and JUTSU_SUPABASE_KEY are present in the environment.
supabase_table = "genie_jobs"

# ---------------------------------------------------------------- engines
# module = "python.module:ClassName"  (plugin interface: app/engines/base.py)
# capabilities: operation types the engine can execute.

[engines.ffmpeg_local]
enabled = true
module = "app.engines.ffmpeg_local:FFmpegLocalEngine"
label = "FFmpeg (box CPU)"
billable = false
capabilities = ["trim", "concat", "grade", "caption", "proxy", "audio_mux", "export", "speed", "crop", "scale", "scene_split", "audio_remux"]
hardware = "box CPU (8 vCPU)"

[engines.mock_gpu]
enabled = true
module = "app.engines.mock_gpu:MockGPUEngine"
label = "Mock GPU (test double, no real model)"
billable = false
test_only = true
capabilities = ["recast", "transform", "remove", "insert", "retexture", "environment"]

[engines.salad_vace14b]
enabled = true
module = "app.engines.salad_comfy:SaladComfyVaceEngine"
label = "Wan 2.1 VACE 14B fp8 / ComfyUI on Salad RTX 5090"
billable = true
mode = "dry_run"                    # "dry_run" builds + validates workflow JSON only. "live" is NOT implemented in this build.
capabilities = ["recast", "transform", "retexture", "environment"]
features = ["character_lora", "control_video_motion_lock", "single_reference_image"]
supports_lora = true
priority = 10                       # lower = preferred. Proven in the Oct 6 2026 Character eval.
verified = true
hardware = "Salad Cloud RTX 5090 32GB (org your-salad-org / project default)"
salad_org = "your-salad-org"
salad_project = "default"
# Model files (as proven in the Oct 6 2026 Character eval). Swap these to upgrade.
diffusion_model = "wan2.1_vace_14B_fp8e4m3fn.safetensors"
diffusion_dtype = "fp8_e4m3fn"
text_encoder = "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
vae = "wan_2.1_vae.safetensors"
hf_repo = "Comfy-Org/Wan_2.1_ComfyUI_repackaged"
# Recipe defaults (v3f)
width = 640
height = 640
frames = 49
fps = 16
steps = 20
cfg = 6.0
sampler = "uni_pc"
scheduler = "simple"
shift = 8.0
control_strength = 0.95
seed = 42
# Cost model (ESTIMATE ONLY; verify current price in the Salad portal before approving)
price_per_hour_usd = 0.50           # Salad RTX 5090 (32 GB) HIGH priority list price, verified Oct 7 2026 via Salad gpu-classes API + salad.com/pricing (vCPU/RAM included; billed per second while running; boot/pull free). medium 0.417 / low 0.333 / batch 0.25
render_seconds_per_49f = 355        # measured: 350-380s per 640x640x49f job (Oct 6 eval)
boot_overhead_seconds = 1200        # measured: ~20 min image pull + model download + fp8 convert

[engines.minimax_h3]
enabled = true
module = "app.engines.minimax_h3:MiniMaxH3Engine"
label = "MiniMax H3 (open weights) / ComfyUI on Salad RTX 5090 - UNVERIFIED"
billable = true
mode = "dry_run"                    # package builder only; no weights downloaded, no Salad calls
verified = false                    # nothing below has been tested by us yet
priority = 50                       # routed only when explicitly requested, or when the VACE engine can't take the op
capabilities = ["recast", "transform", "retexture", "environment", "insert"]
features = ["reference_character_consistency", "motion_reference_video", "video_editing", "native_stereo_audio", "audio_reference"]
supports_lora = false               # Wan LoRAs (e.g. Character step 2500) do NOT apply to H3; identity comes from reference images
hardware = "Salad Cloud RTX 5090 32GB, single GPU, ComfyUI repack (ref2va pruned int8 21 GB + nvfp4 TE 15.7 GB, loaded sequentially: should fit, NOT test-run)"
salad_org = "your-salad-org"
salad_project = "default"
hf_repo = "MiniMaxAI/MiniMax-H3"
weights_source = "HF Comfy-Org/MiniMax-H3 text encoder + VAEs, WarmBloodAban Singularity v1.3 trimmed int8, lightx2v Minimax-h3-Turbo 8-step v1.1 (the only speed LoRA)"
license = "MiniMax H3 Community License (Aug 2 2026). US use needs a SEPARATE written authorization from MiniMax: get your own and record it in the license_* fields. The original author's authorization does NOT transfer to you."
license_blocked = false             # unblocked by the Oct 7 2026 authorization
license_authorized = true
license_holder = "<your name or company>"
license_date = "2026-10-07"
license_proof = "licenses/<your authorization file>"
license_email = "<where your authorization came from>"
comfyui_min_version = "0.42.5"
templates = ["T2V", "I2V", "R2V"]   # ComfyUI native templates, verified to exist (ComfyUI >= 0.30.0; our Salad image is comfy 0.7.0, so it would need an upgrade)
checkpoint_fl2va = "minimax_h3_fl2va_pruned_int8_convrot.safetensors"    # 20.97 GB (Comfy template default). also: pruned_fp8_scaled 20.96 GB, pruned_w6a8 15.98 GB, pruned_bf16 40.23 GB
checkpoint_ref2va = "minimax_h3_ref2va_pruned_int8_convrot.safetensors"  # 20.97 GB (Comfy R2V template default)
official_ui_template = "config/workflows/minimax_h3_r2v.official-ui-template.json"  # Comfy-Org/workflow_templates video_minimax_h3_r2v.json (UI format; res_multistep/simple, 20 steps, shift 12 baked into model)
workflow_template = "config/workflows/minimax_h3_r2v.UNVERIFIED.json"
max_ref_images = 9                  # model ceiling only. GJ V2 default refs are separate crops (face, body on full-body shots, outfit), never a 9-piece sheet.
ref_recipe = "separate"
max_ref_videos = 3
max_ref_audios = 3
height = 768
fps = 24
max_seconds = 15
default_seconds = 5
min_seconds = 5                     # H3 output is 5-15 s (frames snap to 17k+5 at 24 fps, e.g. 124 frames); video refs must be 2-15 s
# Cost model (ESTIMATE ONLY, no measured H3 timings yet)
price_per_hour_usd = 0.50           # Salad RTX 5090 HIGH priority list price (verified Oct 7 2026)
render_seconds_per_output_second = 120   # GUESS; replace after first measured run
boot_overhead_seconds = 1500        # GUESS: image pull + weight download

# Candidate engines from the runbook. Listed so the registry can report them, but NOT
# verified/installed (weights, license, VRAM not checked). Kept disabled.
[engines.wan22_animate]
enabled = false
module = ""
label = "Wan 2.2 Animate (people recast) - unverified"
billable = true
capabilities = ["recast"]
note = "Needs license/weights/VRAM verification before enabling."

[engines.ltx_inpaint]
enabled = false
module = ""
label = "LTX-Video inpainting (masked edits) - unverified"
billable = true
capabilities = ["remove", "insert"]
note = "Needs verification."

[engines.lucy_edit]
enabled = false
module = ""
label = "Lucy Edit (general edits) - unverified"
billable = true
capabilities = ["transform", "retexture"]
note = "Check license permits use before enabling."

# ================================================================ GENJUTSU (open Higgsfield Genjutsu clone)
# Engines below are routed by app/genjutsu/router.py from a ShotSpec (mode: motion_transfer / character_swap /
# object_swap / restyle / upscale). They have NO legacy `capabilities`, so the old Director pipeline never picks them.
# All are billable dry_run package builders until Phase 1 measures them; nothing here dispatches a GPU.
[genjutsu]
default_provider = "runpod_pod"
default_gpu = "5090"

[genjutsu.router]
tie_margin = 0.05                    # LLM tiebreak only when the top two are within this score

[genjutsu.h3]
draft_accel = "turbo8"               # GJ V2: lightx2v 8-step v1.1 at 0.8, shift 6/3
final_accel = "turbo8"
draft_vae = "light"                  # LynnReal light decoder
final_vae = "standard"               # "x2" = X2 Detail VAE (2x decode) once Phase 1 checks it
veda = false                         # Veda sparse attention toggle (5090 / PRO 6000 only; 3x faster/step in Phase 1)
vsa = false                          # Ref2VA VSA learned sparse gate (experimental; forces the int8 trunk)
motion_ref_short_edge_draft = 384    # Ref2VA motion reference resample (ShotSpec.motion_ref_short_edge overrides)
motion_ref_short_edge_final = 544
prompt_format = "context_ir"         # H3 Context-IR sections (subject_definitions ... non_diegetic_music); "plain" = old one-liner

[engines.genjutsu_h3_ref2va]
enabled = true
module = "app.engines.genjutsu_comfy:GenjutsuComfyEngine"
label = "MiniMax H3 Ref2VA (motion transfer; PDD/HyperFlow accel)"
recipe = "h3_ref2va"
billable = true
mode = "dry_run"
verified = false
priority = 20
genjutsu_modes = ["motion_transfer", "character_swap", "restyle"]
subjects = ["any"]
mode_scores = { motion_transfer = 0.90, character_swap = 0.55, restyle = 0.60 }
identity = 0.80
motion = 0.80
speed = 0.75                         # PDD 4-step draft
max_native_seconds = 15
multi_subject = true
native_audio = true
style_image_ref = true
restyle_strengths = ["textured", "flat"]
fallback = "genjutsu_scail2"
est_gpu_seconds = { draft = 150, final = 520 }   # per 5 s @ 5090, ESTIMATE (research: 15 s 768p 20-step 518 s); Phase 1 replaces

[engines.genjutsu_viggle]
enabled = true
module = "app.engines.genjutsu_comfy:GenjutsuComfyEngine"
label = "Viggle-Animate (H3 33B fine-tune, person swap from 1 still / repainted frame)"
recipe = "viggle_animate"
billable = true
mode = "dry_run"
verified = false
priority = 10
genjutsu_modes = ["character_swap"]
subjects = ["human", "creature"]
mode_scores = { character_swap = 0.92 }
identity = 0.80
motion = 0.92
speed = 0.95                         # DMD 3 forward passes, no text encoder
max_native_seconds = 15
multi_subject = false
in_place_replacement = true
weak_reentry = true                  # identity drifts when the subject re-enters frame
fallback = "genjutsu_scail2"
est_gpu_seconds = { draft = 60, final = 150 }

[engines.genjutsu_scail2]
enabled = true
module = "app.engines.genjutsu_comfy:GenjutsuComfyEngine"
label = "SCAIL-2 (Wan2.1-14B): replacement / animation, multi-character, animals, masks"
recipe = "scail2"
billable = true
mode = "dry_run"
verified = false
priority = 30
genjutsu_modes = ["character_swap", "motion_transfer"]
subjects = ["any"]
mode_scores = { character_swap = 0.80, motion_transfer = 0.72 }
identity = 0.82                      # DPO LoRA
motion = 0.80
speed = 0.50
max_native_seconds = 5
segments = "extend chain (2 x 81 frames in-template; longer = Phase 2)"
multi_subject = true
in_place_replacement = true
masked_swap = true
wan_lora_compatible = true
fallback = "genjutsu_wan_animate2"
