# ---------------------------------------------------------------- auto swap (Oct 17 2026)
# The system makes the calls (app/genjutsu/auto_swap.py, scripts/auto_swap.py). Default engine for person swaps.
[auto_swap]
engine = "h3swap_akatz"             # Oct 17: A = akatz H3 Character Swap V1.5 (default), B = h3swap_alis, C = wan22_animate_replace (Kijai stock); see [h3swap]
tier = "720p"                       # native aspect, long side 1280, /16 bucket, never crop
bg_lock = false                     # round-5 halo source; opt-in only
grain = false
skin_finish = false
stall_s = 600                       # only auto-stop: no ComfyUI progress for 10 min
drift_guard = false                 # opt-in; killed healthy renders in round 5
min_refs = 3                        # fail closed below this
mask_grow_px = 0                    # DEFAULT tight person mask + feather (the owner Oct 17: outline showed exactly at the grown border). Option C Kijai stock = 10 (+Blockify 32), opt-in only via JUTSU_MASK_GROW=10
mask_feather_px = 3                 # soft edge on the tight mask (2-4 px)

[h3swap]
default = "h3swap_akatz"            # GJ V2 A08: realism 0.7 + swap v1.5 1.0 + lightx2v 8-step v1.1 0.8, 8 steps, shift 6/3, euler/simple, seed 42. No turbo_v4, no likeness LoRA.
option_b = "h3swap_alis"            # B: Alissonerdx char swap 1.0 + head swap 0.5, AddGuide frame_idx 0, body_swap: prompt
option_c = "wan22_animate_replace"  # C: Wan 2.2 Animate replace; tight mask (grow 0, feather 3) by default, Kijai stock grow 10 + blockify 32 via JUTSU_MASK_GROW=10
frames = "17n+5"                    # H3 grid at 24 fps (124 = 5.17 s)
bg_lock = false
composite = false                   # full-frame regen, never paste model output back onto the source
grain = false
image = "worker/Dockerfile.h3swap"  # manifest group "h3swap"
